<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixture: Footnotes (no paged.js)</title>
    <script>
      var _nbprint_configuration = {
        pagedjs: false,
        debug: false,
        page: '{"orientation": null, "size": null}',
      };
      var _nbprint_notebook_info = new Map();
      window.FontAwesomeConfig = { searchPseudoElements: true };
    </script>
    <script type="module" src="/js/dist/embedded.js"></script>
    <link rel="stylesheet" href="/js/dist/css/embedded.css" />
    <link rel="stylesheet" href="/js/dist/css/index.css" />
    <style>
      /* What the JupyterLab theme and notebook.css provide in a real report */
      :root {
        --jp-content-font-family: Arial, Helvetica, sans-serif;
        --jp-content-font-size0: 0.83333em;
        --jp-content-font-color1: rgba(0, 0, 0, 0.87);
      }
      .jp-RenderedHTMLCommon {
        font-family: var(--jp-content-font-family);
        font-size: 14px;
      }
      body.jp-Notebook {
        margin: 0;
        padding: 0 !important;
      }
      @page {
        margin: 0.5in;
      }
    </style>
  </head>
  <body
    class="jp-Notebook"
    data-jp-theme-light="true"
    data-jp-theme-name="JupyterLab Light"
  >
    <main>
      <div class="jp-Cell">
        <div class="jp-Cell-outputWrapper">
          <div class="jp-OutputArea jp-Cell-outputArea">
            <div
              class="jp-OutputArea-output jp-RenderedHTMLCommon"
              id="content"
            >
              <p id="first">
                Revenue grew 12%<span class="nbprint-footnote"
                  >Unaudited, as of Q3.</span
                >
                year over year.
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
